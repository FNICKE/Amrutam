name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: amrutam_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV:             test
      DATABASE_URL:         postgresql://postgres:password@localhost:5432/amrutam_test
      REDIS_URL:            redis://localhost:6379
      JWT_SECRET:           test_jwt_secret_at_least_32_chars_long
      JWT_REFRESH_SECRET:   test_refresh_secret_at_least_32_chars
      JWT_EXPIRES_IN:       15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS:        4

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test -- --coverage --forceExit

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t amrutam-api:${{ github.sha }} .

      - name: Test Docker image starts
        run: |
          docker run -d --name test-container \
            -e JWT_SECRET=test_jwt_secret_at_least_32_chars_long \
            -e JWT_REFRESH_SECRET=test_refresh_secret_at_least_32 \
            -e DATABASE_URL=postgresql://x:x@localhost:5432/x \
            amrutam-api:${{ github.sha }} || true
